<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer ring: deep navy circle -->
  <circle cx="100" cy="100" r="95" fill="#0B1220" stroke="#D4A83A" stroke-width="2"/>
  <!-- Gold ring -->
  <circle cx="100" cy="100" r="75" stroke="#D4A83A" stroke-width="1.5" opacity="0.4"/>
  <!-- Iris outer -->
  <circle cx="100" cy="100" r="60" stroke="#D4A83A" stroke-width="2" opacity="0.6"/>
  <!-- Iris pattern lines -->
  <g stroke="#D4A83A" stroke-width="1" opacity="0.5">
    <line x1="100" y1="42" x2="100" y2="68"/>
    <line x1="100" y1="132" x2="100" y2="158"/>
    <line x1="42" y1="100" x2="68" y2="100"/>
    <line x1="132" y1="100" x2="158" y2="100"/>
    <line x1="60" y1="60" x2="78" y2="78"/>
    <line x1="122" y1="122" x2="140" y2="140"/>
    <line x1="60" y1="140" x2="78" y2="122"/>
    <line x1="122" y1="78" x2="140" y2="60"/>
  </g>
  <!-- Electric blue glow ring -->
  <circle cx="100" cy="100" r="42" stroke="#4A90D9" stroke-width="2.5" opacity="0.7"/>
  <!-- Pupil -->
  <circle cx="100" cy="100" r="28" fill="#0B1220" stroke="#D4A83A" stroke-width="1.5"/>
  <!-- Inner highlight -->
  <circle cx="100" cy="100" r="14" fill="#D4A83A" opacity="0.85"/>
  <circle cx="100" cy="100" r="7" fill="#0B1220"/>
  <!-- Center dot gold -->
  <circle cx="100" cy="100" r="3.5" fill="#D4A83A"/>
</svg>
